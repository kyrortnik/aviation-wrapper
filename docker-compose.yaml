services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aviation-wrapper-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      LOGGING_LEVEL_ROOT: "INFO"
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: aviation-wrapper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.35.0
    container_name: aviation-wrapper-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:9.5.10
    container_name: aviation-wrapper-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus


volumes:
  redis_data: